name: CI

on:
  push:
    branches: [main]
  pull_request:

# `main` tem auto-deploy para Render e Vercel: cancelar execuções antigas do mesmo
# ref evita que um commit mais novo seja validado depois de um mais antigo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # O teste do PDF da proposta gera o arquivo de verdade (Puppeteer), então o
      # Chromium é baixado no install. Cachear evita ~150 MB por execução.
      - name: Cache do Chromium do Puppeteer
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Postgres vem do compose do projeto, que já cria o banco `insurance_test` via
      # docker/postgres-init.sql na porta 5433 — a mesma do dev, então os defaults de
      # .env.example valem sem ajuste.
      #
      # O storage não: a MinIO fechou o acesso público às suas imagens (401 tanto em
      # quay.io quanto no Docker Hub), então aqui sobe um servidor S3 compatível que
      # ainda é público, criando o bucket pela própria env. O dev local segue com
      # MinIO no docker-compose.yml; a suíte passa igual nos dois.
      - name: Subir Postgres e storage S3
        run: |
          cp .env.example .env
          docker compose up -d --wait postgres
          docker run -d --name s3mock -p 9000:9090 \
            -e initialBuckets=insurance-documents adobe/s3mock:latest
          for i in $(seq 1 40); do
            if curl -sf -o /dev/null http://localhost:9000/; then
              echo "storage S3 pronto"
              break
            fi
            if [ "$i" = 40 ]; then
              echo "storage S3 não respondeu" >&2
              exit 1
            fi
            sleep 2
          done

      # postinstall roda `prisma generate` e compila packages/shared e packages/database.
      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      # Os testes de integração aplicam as migrations em insurance_test por conta
      # própria (apps/api/test/app.factory.ts).
      - run: npm test

      - name: Logs dos serviços (em caso de falha)
        if: failure()
        run: |
          docker compose logs --no-color --tail 50 postgres
          docker logs --tail 50 s3mock
